[mypy]
python_version = 3.14
exclude = ^(tests/|data/)

# The shipped package: hold this to a strict bar. These flags catch missing
# annotations and Optional-by-default params without turning on full --strict,
# which would also fight the third-party stubs below.
[mypy-commentlint.*]
disallow_untyped_defs = True
warn_return_any = True
no_implicit_optional = True
warn_unused_ignores = True

# Research/training scripts: numpy/torch-heavy, looser bar intentionally.
[mypy-train]
ignore_missing_imports = True

[mypy-train_linear]
ignore_missing_imports = True

# Third-party deps with no type stubs. Scoped per-module rather than a global
# ignore_missing_imports, so a typo in a first-party import still errors.
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-pathspec.*]
ignore_missing_imports = True
